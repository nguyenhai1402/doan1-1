<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - Quản trị</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="admincss/qt-admin.css">
</head>

<body>
    <div id="noiDungTrang">
        <div class="qt-card">
            <div class="row g-2 align-items-end">
                <div class="col-md-4"><label class="form-label">Tìm theo tên hoặc mã SKU</label><input type="text" class="form-control" id="spTim" placeholder="Nhập từ khóa..."></div>
                <div class="col-md-3 col-6"><label class="form-label">Danh mục</label><select class="form-select" id="spLocDM"></select></div>
                <div class="col-md-3 col-6"><label class="form-label">Trạng thái</label>
                    <select class="form-select" id="spLocTT"><option value="">Tất cả</option><option>Xuất bản</option><option>Ẩn</option><option>Hết hàng</option></select></div>
                <div class="col-md-2 text-md-end"><button class="btn btn-primary w-100" id="spThem"><i class="fa-solid fa-plus"></i> Thêm sản phẩm</button></div>
            </div>
        </div>
        <div class="qt-card">
            <div class="table-responsive"><table class="table table-hover align-middle mb-2">
                <thead><tr><th class="d-none d-md-table-cell">Mã</th><th>Sản phẩm</th><th class="d-none d-lg-table-cell">Danh mục</th><th class="text-end">Giá bán</th><th class="d-none d-md-table-cell">Nhãn</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead>
                <tbody id="spBang"></tbody>
            </table></div>
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2"><span class="text-secondary small" id="spTong"></span><div id="spTrang"></div></div>
        </div>

        <!-- Hộp xem chi tiết sản phẩm (UCQLSP01) -->
        <div class="modal fade" id="modalXemSP" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Chi tiết sản phẩm</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body" id="spChiTiet"></div>
            <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button></div>
        </div></div></div>

        <!-- Hộp thêm / sửa sản phẩm (UCQLSP02, UCQLSP03) -->
        <div class="modal fade" id="modalSP" tabindex="-1" data-bs-backdrop="static"><div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="spTieuDe">Thêm sản phẩm</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-md-8"><label class="form-label">Tên sản phẩm *</label><input type="text" class="form-control" id="spTen"></div>
                    <div class="col-md-4"><label class="form-label">Mã SKU *</label><input type="text" class="form-control" id="spSku"></div>
                    <div class="col-md-6"><label class="form-label">Loại sản phẩm (danh mục) *</label><select class="form-select" id="spLoai"></select></div>
                    <div class="col-md-3 col-6"><label class="form-label">Giá bán (đ) *</label><input type="number" min="0" class="form-control" id="spGia"></div>
                    <div class="col-md-3 col-6"><label class="form-label">Nhãn</label><select class="form-select" id="spNhan"><option value="">Không có</option><option>NEW</option><option>BEST SELLER</option></select></div>
                    <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="spKhongKM"><label class="form-check-label" for="spKhongKM">Không áp dụng khuyến mãi</label></div></div>
                    <div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" id="spMoTa" rows="2"></textarea></div>
                </div>

                <h6 class="mt-4 text-danger-emphasis" style="color:var(--qt-dam)">Biến thể (màu sắc, kích thước)</h6>
                <div class="table-responsive"><table class="table table-sm align-middle">
                    <thead><tr><th>Màu *</th><th>Size *</th><th>SKU biến thể *</th><th>Mã vạch *</th><th>Giá (đ) *</th><th>Tồn *</th><th></th></tr></thead>
                    <tbody id="spBienThe"></tbody>
                </table></div>
                <button class="btn btn-sm btn-outline-primary" id="spThemBT"><i class="fa-solid fa-plus"></i> Thêm biến thể</button>

                <h6 class="mt-4" style="color:var(--qt-dam)">Hình ảnh theo màu</h6>
                <div class="table-responsive"><table class="table table-sm align-middle">
                    <thead><tr><th style="width:25%">Màu</th><th>Đường dẫn ảnh (ví dụ img/img_aonam/sp2.2.webp)</th><th></th></tr></thead>
                    <tbody id="spAnh"></tbody>
                </table></div>
                <button class="btn btn-sm btn-outline-primary" id="spThemAnh"><i class="fa-solid fa-plus"></i> Thêm ảnh</button>
                <div class="qt-loi mt-3" id="spLoi"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary" id="spLuu">Lưu</button></div>
        </div></div></div>
    </div>
    <script src="../js/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/products.js"></script>
    <script src="adminjs/qt-data.js"></script>
    <script src="adminjs/qt-common.js"></script>
    <script src="adminjs/qt-sanpham.js"></script>
</body>

</html>
