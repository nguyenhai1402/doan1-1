<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Khách Hàng</title>
  <link rel="stylesheet" href="./admincss/cssforalladmin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
</head>

<body>
  <header>
    <div class="user-menu">
      Hải
      <i class="fa-solid fa-sort-down"></i>
      <div class="dropdown">
        <a href="#">Đăng xuất</a>
      </div>
    </div>
  </header>

  <div class="container">
    <nav>
      <a href="admin.html" ><i class="fa-solid fa-user" style="font-size:0.8rem"></i>Thông tin tài khoản</a>
      <a href="admin-order.html"><i class="fa-solid fa-box-open" style="font-size:0.6rem"></i>Quản lý đơn đặt hàng</a>
      <a href="admin-loaisp.html"><i class="fa-solid fa-tags" style="font-size:small"></i>Quản lý sản phẩm</a>
      <a href="thongke.html"><i class="fa-solid fa-chart-line" style="font-size:small"></i>Thống kê bán hàng</a>
      <a href="hoadonnhap.html"><i class="fa-solid fa-file-invoice" style="font-size:1.1rem"></i>Hóa đơn nhập</a>
      <a href="nhacungcap.html"><i class="fa-solid fa-truck" style="font-size:0.7rem"></i>Nhà cung cấp</a>
      <a href="khachhang.html" class="active"><i class="fa-solid fa-user-friends" style="font-size:0.7rem"></i>Khách hàng</a>
      <a href="nhanvien.html"><i class="fa-solid fa-user-tie" style="font-size:0.9rem"></i>Nhân viên</a>
      <a href="#"><i class="fa-solid fa-blog" style="font-size:small"></i>Blog</a>
    </nav>

    <div class="content">
      <h2>Danh sách Khách Hàng</h2>

      <div class="filter-bar">
        <input type="text" placeholder="Tìm theo tên hoặc email...">
        <button class="btn btn-add" onclick="moMenu()">+ Thêm khách hàng</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>STT</th>
            <th>Mã KH</th>
            <th>Tên khách hàng</th>
            <th>Email</th>
            <th>Số điện thoại</th>
            <th>Địa chỉ</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="customer-table">
          <tr>
            <td>1</td>
            <td>KH001</td>
            <td>Nguyễn Văn A</td>
            <td>vana@gmail.com</td>
            <td>0909999999</td>
            <td>Hà Nội</td>
            <td>
              <button class="btn btn-edit" onclick="moMenu('KH001','Nguyễn Văn A','vana@gmail.com','0909999999','Hà Nội')"><i class="fas fa-pen"></i></button>
              <button class="btn btn-delete"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="pagination">
        <button><<</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>>></button>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="customerModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="dongMenu()">x</span>
      <h3 id="modalTitle">Thêm khách hàng</h3>
      <input type="text" id="customerId" placeholder="Mã khách hàng">
      <input type="text" id="customerName" placeholder="Tên khách hàng">
      <input type="email" id="customerEmail" placeholder="Email">
      <input type="text" id="customerPhone" placeholder="Số điện thoại">
      <input type="text" id="customerAddress" placeholder="Địa chỉ">
      <div class="modal-buttons">
        <button class="btn btn-add" onclick="luuKhachHang()">Lưu</button>
        <button class="btn btn-delete" onclick="dongMenu()">Hủy</button>
      </div>
    </div>
  </div>

  <script src="adminjs/admin.js"></script>
  <script src="adminjs/khachhang.js"></script>
</body>

</html>
