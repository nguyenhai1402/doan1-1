<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập quản trị</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="admincss/qt-admin.css">
</head>

<body>
    <div class="qt-login">
        <div class="hop">
            <h1>Đăng nhập quản trị</h1>
            <p class="text-center text-secondary">Duc Hai Styles</p>
            <div class="mb-3">
                <label class="form-label" for="dnEmail">Email</label>
                <input type="text" class="form-control" id="dnEmail" autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label" for="dnMatKhau">Mật khẩu</label>
                <input type="password" class="form-control" id="dnMatKhau" autocomplete="current-password">
            </div>
            <div class="qt-loi mb-3" id="dnLoi"></div>
            <button class="btn btn-primary w-100" id="dnNut">Đăng nhập</button>
            <hr>
            <p class="small text-secondary mb-1">Tài khoản mẫu (bấm để điền sẵn):</p>
            <div class="small">
                <a href="#" class="tk-mau d-block" data-email="admin@duchai.vn" data-mk="Admin@123">Quản trị viên: admin@duchai.vn / Admin@123</a>
                <a href="#" class="tk-mau d-block" data-email="cskh@duchai.vn" data-mk="Cskh@123">Nhân viên CSKH: cskh@duchai.vn / Cskh@123</a>
            </div>
        </div>
    </div>

    <script src="../js/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/products.js"></script>
    <script src="adminjs/qt-data.js"></script>
    <script src="adminjs/qt-common.js"></script>
    <script src="adminjs/qt-dangnhap.js"></script>
    <script>$(".tk-mau").on("click", function (e) { e.preventDefault() })</script>
</body>

</html>
