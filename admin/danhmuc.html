<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục - Quản trị</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="admincss/qt-admin.css">
</head>

<body>
    <div id="noiDungTrang">
        <div class="row g-3">
            <div class="col-lg-6">
                <div class="qt-card">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h2 class="mb-0">Cây danh mục</h2>
                        <button class="btn btn-primary btn-sm" id="dmThem"><i class="fa-solid fa-plus"></i> Thêm danh mục</button>
                    </div>
                    <div id="dmCay"></div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="qt-card" id="dmChiTiet"><p class="text-secondary mb-0">Chọn một danh mục trong cây để xem chi tiết.</p></div>
            </div>
        </div>

        <!-- Hộp thêm / sửa danh mục (UCQLDM02, UCQLDM03) -->
        <div class="modal fade" id="modalDM" tabindex="-1" data-bs-backdrop="static"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="dmTieuDe">Thêm danh mục</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-3"><label class="form-label">Tên danh mục *</label><input type="text" class="form-control" id="dmTen"></div>
                <div class="mb-3"><label class="form-label">Danh mục cha</label><select class="form-select" id="dmCha"></select>
                    <div class="form-text">Để trống nếu là thương hiệu. Tối đa ba cấp: Thương hiệu, Nhóm, Loại.</div></div>
                <div class="qt-loi" id="dmLoi"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary" id="dmLuu">Lưu</button></div>
        </div></div></div>
    </div>
    <script src="../js/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/products.js"></script>
    <script src="adminjs/qt-data.js"></script>
    <script src="adminjs/qt-common.js"></script>
    <script src="adminjs/qt-danhmuc.js"></script>
</body>

</html>
