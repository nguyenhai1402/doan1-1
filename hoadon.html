<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Hóa đơn mua hàng</title>
    <link rel="stylesheet" href="css/hoadon.css">
</head>

<body>
    <div class="hoadon-container">
        <h1>HÓA ĐƠN MUA HÀNG</h1>
        <p class="ma-don">Mã đơn: <strong id="ma-don"></strong> &nbsp;|&nbsp; Ngày đặt: <span id="ngay-dat"></span></p>

        <div class="section">
            <h3>Thông tin khách hàng</h3>
            <p><strong>Họ tên:</strong> <span id="ho-ten"></span></p>
            <p><strong>Email:</strong> <span id="email"></span></p>
            <p><strong>SĐT:</strong> <span id="sdt"></span></p>
            <p><strong>Địa chỉ:</strong> <span id="dia-chi"></span></p>
        </div>

        <div class="section">
            <h3>Thông tin đơn hàng</h3>
            <table class="bang-sp">
                <thead>
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>SL</th>
                        <th>Thành tiền</th>
                    </tr>
                </thead>
                <tbody id="ds-sp"></tbody>
            </table>
            <p><strong>Tạm tính:</strong> <span id="tam-tinh"></span></p>
            <p><strong>Phí vận chuyển:</strong> <span id="phi-ship"></span></p>
            <p><strong>Giảm giá:</strong> <span id="tien-giam"></span></p>
            <p class="tong"><strong>Tổng cộng:</strong> <span id="tong-gia"></span></p>
            <p><strong>Phương thức thanh toán:</strong> <span id="phuong-thuc"></span></p>
            <p><strong>Tình trạng thanh toán:</strong> <span id="thanh-toan"></span></p>
            <p><strong>Trạng thái đơn hàng:</strong> <span id="trang-thai"></span></p>
        </div>
        <!-- in hóa đơn -->
        <button onclick="window.print()">In hóa đơn</button>
        <a class="ve-trang-chu" href="index.html">Về trang chủ</a>

    </div>

    <script src="js/hoadon.js"></script>
</body>

</html>
